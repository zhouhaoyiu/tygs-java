server.address=127.0.0.1
server.port=${PORT:8097}
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=2KB
spring.datasource.url=jdbc:h2:file:${LOCAL_DATA_DIR:./local-data}/facilities;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=local
spring.datasource.password=${LOCAL_DB_PASSWORD}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5197,http://localhost:5197}
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
