server.max-http-header-size=10240000
server.port=8090

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sys?useunicode=true&serverTimezone=GMT%2B8&useSSL=false&autoReconnect=true&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name= com.mysql.cj.jdbc.Driver
spring.mvc.static-path-pattern=/images/**
spring.web.resources.static-locations[]=file:E://market//goods//images
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
